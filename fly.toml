app = "dream-gen-bot"
primary_region = "cdg"

[build]
  builder = "paketobuildpacks/builder:base"
  buildpacks = ["gcr.io/paketo-buildpacks/python"]
  [[build.args]]
    name = "BP_CPYTHON_VERSION"
    value = "3.11"

[env]
  PORT = "8080"
  BP_LAUNCH_COMMAND = "python3 bot.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
